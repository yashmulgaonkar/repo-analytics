name: Update analytics

on:
  schedule:
    # Hourly by default. Edit this cron for your own schedule (Actions
    # does not interpolate repository variables into schedule triggers).
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require TRAFFIC_TOKEN
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          if [ -z "${TRAFFIC_TOKEN}" ]; then
            echo "::error::Missing repository secret TRAFFIC_TOKEN. Create a classic PAT with the repo scope and add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect metrics
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python3 scripts/collect.py

      - name: Render SVGs
        run: python3 scripts/render.py

      - name: Commit and push if changed
        env:
          GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
        run: |
          name="${GIT_AUTHOR_NAME:-${{ github.actor }}}"
          email="${GIT_AUTHOR_EMAIL:-${{ github.actor }}@users.noreply.github.com}"
          git config user.name "$name"
          git config user.email "$email"
          git add data out
          if git diff --staged --quiet; then
            echo "No analytics changes"
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
          chore: refresh repository analytics

          EOF
          )"
          git push
